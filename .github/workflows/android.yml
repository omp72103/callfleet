name: Build APK

# Builds a debug APK on every push and on manual run, and uploads it as a
# downloadable artifact. GitHub's runners have the Android SDK and open
# internet, so this works even though the project author's environment did not.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # skip the removed legacy 'tools' package; install exacts below

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Priority: (1) a GOOGLE_SERVICES_JSON repo secret -> a fully live APK;
      # (2) a committed google-services.json; (3) the committed placeholder, which
      # builds and runs the UI but cannot connect to Firebase.
      - name: Ensure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # Accept either raw JSON or base64-encoded JSON in the secret.
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > /tmp/gs.json 2>/dev/null || true
            if head -c1 /tmp/gs.json 2>/dev/null | grep -q '{'; then
              cp /tmp/gs.json app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            fi
            echo "Using google-services.json from repo secret (Firebase enabled)."
          elif [ ! -f app/google-services.json ]; then
            cp app/google-services.placeholder.json app/google-services.json
            echo "Using placeholder google-services.json (Firebase sync disabled)."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: callfleet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
