name: Build APK

# Builds a debug APK on every push and on manual run, and uploads it as a
# downloadable artifact. GitHub's runners have the Android SDK and open
# internet, so this works even though the project author's environment did not.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # If no real google-services.json is committed (it is gitignored), write a
      # syntactically valid placeholder so the build succeeds. The resulting APK
      # installs and the UI works; Firebase sync only works once you replace this
      # with your real file from the Firebase console.
      - name: Ensure google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.template app/google-services.json
            python3 - <<'PY'
import json
p="app/google-services.json"
d=json.load(open(p))
d.pop("_comment",None)
d["project_info"]["project_number"]="000000000000"
d["project_info"]["project_id"]="callfleet-placeholder"
d["project_info"]["storage_bucket"]="callfleet-placeholder.appspot.com"
c=d["client"][0]
c["client_info"]["mobilesdk_app_id"]="1:000000000000:android:0000000000000000000000"
c["api_key"][0]["current_key"]="AIzaSyDUMM_PLACEHOLDER_KEY_000000000000000"
json.dump(d,open(p,"w"),indent=2)
print("placeholder google-services.json written")
PY
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: callfleet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
