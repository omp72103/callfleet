name: Build APK

# Builds a debug APK on every push and on manual run, and uploads it as a
# downloadable artifact. GitHub's runners have the Android SDK and open
# internet, so this works even though the project author's environment did not.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # skip the removed legacy 'tools' package; install exacts below

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # If no real google-services.json is committed (it is gitignored), fall back
      # to the committed placeholder so the build succeeds. The resulting APK
      # installs and the UI works; Firebase sync only works once you replace this
      # with your real file from the Firebase console.
      - name: Ensure google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.placeholder.json app/google-services.json
            echo "Using placeholder google-services.json (Firebase sync disabled)."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: callfleet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
